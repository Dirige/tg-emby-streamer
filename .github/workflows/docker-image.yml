name: 构建并发布 Docker 镜像

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  packages: write

# GitHub 自带的 GITHUB_TOKEN 只在当前仓库有效，不需要个人信息访问令牌；
# Docker Hub 的发布是可选的：仓库未配置 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
# 时自动跳过，仅发布到 GHCR。
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 QEMU（用于 arm64 构建）
        uses: docker/setup-qemu-action@v3

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 GHCR 标签
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tgemby
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=long

      - name: 构建并推送 GHCR（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 登录 Docker Hub（可选，未配置 Token 则跳过）
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成 Docker Hub 标签
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        id: meta_hub
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tgemby
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=long

      - name: 构建并推送 Docker Hub（可选）
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta_hub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
