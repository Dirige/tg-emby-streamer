# ============================================
# TG-Emby-Streamer 配置文件
# ============================================
# Docker 安装脚本自动在 runtime/config/config.yaml 生成实际配置。
# 手动使用时复制此文件并修改参数；不要分享真实配置。
# 所有配置也可通过环境变量覆盖（用于 Docker 部署）

telegram:
  # Telegram API 凭据 (https://my.telegram.org)
  api_id: 0
  api_hash: ""
  phone: ""

  # 可选：Session String（生成后自动填入，优先于 phone 登录）
  session_string: ""

  # 需要监控的频道 ID，逗号分隔
  # 首次 Docker 启动会从 channels.json 填入原频道清单与全部规则。
  monitor_channels: ""

  # 自动监控间隔（分钟），每隔多久扫描一次频道的新消息
  monitor_interval_minutes: 10

proxy:
  # 是否启用代理（Telegram 部分地区需要）
  enabled: false
  scheme: socks5           # socks5 或 http
  # Docker 中 127.0.0.1 指容器自己，不是宿主机。
  host: host.docker.internal
  port: 7890
  username: ""
  password: ""

server:
  # Web 服务监听地址
  host: 0.0.0.0
  port: 8001

  base_url: "http://localhost:8001"

  # STRM 实际使用这个地址；须能被 Emby 和直接播放的客户端访问。
  # 安装脚本会要求填写服务器局域网 IP 或 HTTPS 域名。
  local_url: "http://localhost:8001"

  # 安装脚本自动生成；导入分享数据时会写入接收者自己的 Token。
  stream_token: ""

storage:
  # 数据存储目录（数据库、缓存、下载文件）
  data_dir: /app/config

  # 宿主机 runtime/strm -> 容器 /app/strm -> Emby /media/tg
  strm_dir: /app/strm

  cache_dir: /app/cache
  media_path: /app/cache/media

  # 内存缓存大小（MB）
  memory_cache_size_mb: 256

  # 磁盘缓存上限（GB）
  disk_cache_max_gb: 20
  prefetch_enabled: true
  prefetch_chunks: 8

database:
  # 宿主机 runtime/config/media.db
  url: "sqlite+aiosqlite:////app/config/media.db"

auth:
  # Web 管理面板登录
  username: admin
  # 安装脚本生成随机密码；手动部署也必须填写强密码。
  password: ""

bot:
  # 手动入库管理员用户 ID（逗号分隔多个）
  # 只有这些用户可以将视频转发到 Bot 进行手动入库
  admin_users: ""

notify:
  # 入库通知（扫描完成后发送 Telegram 消息）
  enabled: false
  # 接收通知的用户 ID
  target: ""

  # Bot Token（从 @BotFather 获取），优先于用户账号发送通知
  # 留空则使用用户账号发送（通过 Pyrogram 登录的账号）
  bot_token: ""

# ============================================
# TMDB 元数据刮削（新版本新增）
# 配置后，扫描入库时会自动匹配 TMDB 并生成 NFO + 海报
# ============================================
tmdb:
  # TMDB API Key（在 https://www.themoviedb.org 注册获取）
  api_key: ""
  # API 地址（国内网络可使用自建反代）
  api_base: "https://api.themoviedb.org/3"
  # 图片 CDN 地址
  image_base: "https://image.tmdb.org/t/p"

# Emby 刷新（入库后自动刷新媒体库，可选）
emby:
  # Emby 服务器地址
  url: ""
  # Emby API Key（管理后台 → 高级 → API 密钥）
  api_key: ""

# 刮削开关；已有 NFO 和图片不需要重新刮削。
enrich:
  enabled: true
