# 可移植部署。所有数据都在当前目录的 runtime/；不引用作者机器路径。
# 新安装推荐 bash scripts/install.sh；已有 Emby 可不启用 emby profile。
services:
  tgemby:
    image: ${TGEMBY_IMAGE:-dirige/tgemby:latest}
    build:
      context: .
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    restart: unless-stopped
    ports:
      - "${TGEMBY_BIND:-0.0.0.0}:${TGEMBY_PORT:-8001}:8001"
    volumes:
      - ./runtime/config:/app/config
      - ./runtime/strm:/app/strm
      - ./runtime/cache:/app/cache
      - ./runtime/jav_posters:/app/jav_posters
      # 离线数据包/媒体导入目录：把分享的 .tar.gz 与 checksums 放进这里再 --import
      - ./runtime/share:/app/share
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CONFIG_PATH: /app/config/config.yaml
      METATUBE_URL: ${METATUBE_URL:-http://metatube:8080}
      TGEMBY_DEBUG: ${TGEMBY_DEBUG:-}
      HTTP_PROXY: ${SCRAPER_PROXY:-}
      HTTPS_PROXY: ${SCRAPER_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,tgemby,emby,metatube,proxy,host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      metatube:
        condition: service_started

  metatube:
    image: ${METATUBE_IMAGE:-ghcr.io/metatube-community/metatube-server:latest}
    restart: unless-stopped
    command: ["-dsn", "/config/metatube.db", "-db-auto-migrate"]
    volumes:
      - ./runtime/metatube:/config
    ports:
      - "${METATUBE_BIND:-127.0.0.1}:${METATUBE_PORT:-8082}:8080"
    environment:
      HTTP_PROXY: ${SCRAPER_PROXY:-}
      HTTPS_PROXY: ${SCRAPER_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,tgemby,emby,metatube,proxy,host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway

  emby:
    image: ${EMBY_IMAGE:-lscr.io/linuxserver/emby:latest}
    profiles: [emby]
    restart: unless-stopped
    ports:
      - "${EMBY_BIND:-0.0.0.0}:${EMBY_PORT:-8096}:8096"
    volumes:
      - ./runtime/emby:/config
      - ./runtime/strm:/media/tg:ro
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}

  proxy:
    image: ${MIHOMO_IMAGE:-metacubex/mihomo:latest}
    profiles: [proxy]
    restart: unless-stopped
    volumes:
      - ./runtime/proxy:/root/.config/mihomo
    ports:
      - "127.0.0.1:${PROXY_PORT:-7890}:7890"
